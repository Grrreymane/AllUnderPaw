      else if (SYS.modal[m.type]) { if (!m.pass) HITS = []; TANCH = [20, 1]; SYS.modal[m.type](m); }
      else drop(m);   // a window nobody can draw must not block the game
    }
    // only the top layer scrolls
    const t = top();
    SCR = t ? (SCROLLM.has(t.type) || t.scroll ? t.scr : NOSCR) : (W.loc === 'people' ? PEOPLE_SCR : NOSCR);
    NOSCR.max = NOSCR.maxX = 0;
  }
  layerBreak();
  const keepHits = HITS; drawTopBar(); HITS = keepHits;
  if (!MODAL.some(m => m.type === 'event' || m.type === 'tour' || m.type === 'talk')) drawToasts();
  present();
}
// Text is drawn crisp on top of the pixel layer, so every modal starts a new layer: flush what's below first.
function layerBreak() { present(); g.clearRect(0, 0, W_, H); TQ.length = 0; }

// ============================================================ cover (open index.html#cover, then tools/shot.py -> cover.png)
let shareEl = null;
// cover: the painted key art (art/cover.jpg) with the title over the open sky on the right
function renderCover() {
  const img = new Image();
  img.onload = () => {
    const big = mk(1920, 1080), bx = big.getContext('2d');
    bx.drawImage(img, 0, 0, 1920, 1080);
    const gr = bx.createRadialGradient(1590, 300, 60, 1590, 300, 520); gr.addColorStop(0, 'rgba(10,20,28,.45)'); gr.addColorStop(1, 'rgba(10,20,28,0)');
    bx.fillStyle = gr; bx.fillRect(1000, 0, 920, 900);
    bx.textAlign = 'center'; bx.lineJoin = 'round'; bx.strokeStyle = '#1b1622';
    bx.font = '150px ' + FONT; bx.lineWidth = 24; bx.strokeText('一喵天下', 1590, 250); bx.fillStyle = '#ffe08a'; bx.fillText('一喵天下', 1590, 250);
    bx.font = '52px ' + FONT; bx.lineWidth = 11; bx.strokeText('All Under Paw', 1590, 340); bx.fillStyle = '#f2ead4'; bx.fillText('All Under Paw', 1590, 340);
    bx.font = '40px ' + FONT; bx.lineWidth = 9; bx.strokeText('押宝秦国质子 · 猫猫王朝模拟', 1590, 420); bx.fillText('押宝秦国质子 · 猫猫王朝模拟', 1590, 420);
    document.body.innerHTML = ''; big.style.cssText = 'position:fixed;left:0;top:0;width:1920px;height:1080px'; document.body.appendChild(big);
    document.title = 'COVER READY';
  };
  img.src = 'art/cover.jpg';
}
// ============================================================ present: pixel layer + crisp text
function present() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = false; ctx.globalAlpha = 1;
  ctx.drawImage(low, 0, 0, W_, H, 0, 0, W_ * K, H * K);
  for (const t of TQ) {
    const c = textSprite(t), tw_ = c.w - 2 * c.pad;
    if (t.clip) { ctx.save(); ctx.beginPath(); ctx.rect(t.clip[0] * K, t.clip[1] * K, t.clip[2] * K, t.clip[3] * K); ctx.clip(); }
    ctx.globalAlpha = t.alpha; ctx.drawImage(c.cv, R(t.x * K - c.pad - (t.align === 'center' ? tw_ / 2 : t.align === 'right' ? tw_ : 0)), R(t.y * K - c.h / 2));
    if (t.clip) ctx.restore();
  }
  ctx.globalAlpha = 1;
}
const TXC = new Map();
function textSprite(t) {
  const key = t.s + '|' + t.size + '|' + t.col + '|' + t.stroke + '|' + K + '|' + t.f;
  let c = TXC.get(key); if (c) return c;
  if (TXC.size > 600) TXC.clear();
  const m = document.createElement('canvas'), x = m.getContext('2d'), font = t.size * K + 'px ' + (t.f ? BODY : FONT);
  const r = t.stroke ? Math.max(.75, t.size * .14) * K : 0, pad = Math.ceil(r) + 2;
  x.font = font; m.width = Math.ceil(x.measureText(t.s).width) + pad * 2; m.height = Math.ceil(t.size * K * 1.5) + pad * 2;
  x.font = font; x.textBaseline = 'middle'; x.textAlign = 'left';
  const oy = m.height / 2;
  if (t.stroke) { x.fillStyle = t.stroke; for (const f of [1, .55]) for (let k = 0; k < 16; k++) { const a = k / 16 * Math.PI * 2; x.fillText(t.s, pad + Math.cos(a) * r * f, oy + Math.sin(a) * r * f); } }
  x.fillStyle = t.col; x.fillText(t.s, pad, oy);
  c = { cv: m, w: m.width, h: m.height, pad }; TXC.set(key, c); return c;
}
try { if (document.fonts) { document.fonts.addEventListener('loadingdone', () => TXC.clear()); document.fonts.ready.then(() => TXC.clear()); } } catch (e) {}
const ALLTEXT = [...new Set((SCRIPT_TEXT.match(/[^\x00-\x7f]/g) || []))].join('') + '0123456789+-/!?';
try { if (document.fonts && document.fonts.load) document.fonts.load('12px "ZCOOL QingKe HuangYou"', ALLTEXT).catch(() => {}); } catch (e) {}

// ============================================================ boot
icons();
/*TEST_HOOK*/
if (location.hash === '#cover') { (document.fonts ? document.fonts.ready : Promise.resolve()).then(renderCover); window.__gameBooted = true; return; }
let last = performance.now(), frameErr = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  try { update(dt); render(); frameErr = 0; }
  catch (e) { if (frameErr++ === 0 && window.__gameErr) window.__gameErr(String(e && e.stack || e).slice(0, 600)); }
  requestAnimationFrame(frame);
}
window.__gameBooted = true;
requestAnimationFrame(frame);
})();
