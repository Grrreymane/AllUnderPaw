function drawFamily(m) {

// ============================================================ main screens

}
function drawCity() {

    rect(118, 20, 59, 34, 'rgba(22,18,26,.75)');
    const yr = C('yiren'), a = clamp(opinion(yr, p), 0, 100), b = clamp(opinion(yr, C('lv')), 0, 100);

    txt('你', 122, 32, 5.5, '#ffe08a', 'left', null); rect(130, 30, 44, 4, '#3a3040'); rect(130, 30, R(a * .44), 4, '#e8b040');
    txt('吕', 122, 39, 5.5, '#d0b0ff', 'left', null); rect(130, 37, 44, 4, '#3a3040'); rect(130, 37, R(b * .44), 4, '#9a7bbd');
    if (W.flags.knowHuayang) { txt('立嗣', 122, 47, 5.5, '#c8e0ff', 'left', null); rect(136, 45, 38, 4, '#3a3040'); rect(136, 45, R(clamp(W.heir, 0, 100) * .38), 4, '#6fb88a'); }
  }

  drawPortrait(p, 5, 133, 1, '#e8d4a8'); hit(4, 132, 34, 34, () => openSheet(p.id));
  txt(nm(p), 42, 138, 8, '#fff6dc', 'left', null);
  txt(`${ageOf(p)}岁 · ${RANKS[W.rank]}`, 42, 149, 6, '#c8b8a8', 'left', null);
  for (let i = 0; i < 4; i++) { rect(42 + i * 24, 156, 9, 9, STATC[i]); txt(STATN[i], 46.5 + i * 24, 160.5, 6, '#fff', 'center', null); txt(stat(p, i), 53 + i * 24, 160.5, 6.5, '#f2ead4', 'left', null); }
  btn(140, 133, 36, 16, '家族', 'gold', () => openFamily());
  // actions
  const acts = locActions(loc);
  acts.slice(0, 4).forEach((a, i) => {
    const y = 172 + i * 24, ok = (!a.ok || a.ok()) && W.ap >= (a.ap || 0);
    btn(5, y, 170, 21, a.n, ok ? 'jade' : 'off', () => { if (!ok) { SFX.no(); if (W.ap < (a.ap || 0)) toast('这季没有精力了', '#ff9a8a'); return; } a.fn(); }, a.hint);
    if (a.ap) for (let k = 0; k < a.ap; k++) g.drawImage(ICON.ap, 158 - k * 7, y + 5);
    if (a.fish) { g.drawImage(ICON.fish, 128, y + 12); txt(a.fish, 141, y + 14.5, 5.5, '#ffe08a', 'left', null); }
  });
  // end of season
  rect(5, 272, 50, 18, '#1b1622');
  txt('精力', 9, 281, 6, '#c8b8a8', 'left', null);
  for (let k = 0; k < Math.max(3, W.ap); k++) g.drawImage(k < W.ap ? ICON.ap : ICON.apOff, 29 + k * 7, 278);
  btn(60, 271, 115, 20, W.ap ? '结束本季 ▸' : '结束本季 ▸▸', W.ap ? 'dark' : 'red', () => endSeason());
  // places
  rect(0, 294, W_, 26, PAL.ink);
  LOC_ORDER.forEach((k, i) => {
    const x = 1 + i * 22.2, on = W.loc === k;
    if (on) { rect(x, 295, 21, 24, '#5a4a30'); rect(x, 295, 21, 1, PAL.gold); }
    const ic = ICON[k]; g.drawImage(ic, R(x + 10.5 - ic.width / 2), 297);
    txt(LOCS[k].n.slice(0, 2), x + 10.5, 314, 5, on ? '#ffe08a' : '#a89888', 'center', null);
    hit(x, 294, 22, 26, () => { W.loc = k; });
  });
  // a bouncing arrow over the place worth visiting next (act one only, and only while there is energy)
  const hl = W.ap > 0 ? hintLoc() : null;
  if (hl && hl !== W.loc) {
    const i = LOC_ORDER.indexOf(hl), ax = R(1 + i * 22.2 + 10.5), ay = R(286 - Math.abs(Math.sin(T * 4)) * 3);
    rect(ax - 4, ay - 1, 9, 1, OUT);
    for (let r = 0; r < 4; r++) rect(ax - 3 + r, ay + r, 7 - 2 * r, 1, r === 0 ? '#fff6c0' : '#ffd24a');
  }
}
function hintLoc() {
  if (W.act !== 1 || W.flags.act1Done) return null;
  const yr = C('yiren'), p = P(); if (!alive(yr) || yr.loc !== 'hostage') return null;
  if (!W.flags.metYiren) return 'hostage';
  if (W.fish < 60) return 'market';
  if (W.flags.knowHuayang && opinion(yr, p) >= 25 && W.fish >= 80 && W.heir < 100) return 'gate';
  if (opinion(yr, p) < 25) return 'hostage';
  if (!W.flags.knowHuayang) return 'tavern';
  return null;
}
function drawTitle() {
  g.drawImage(scene('palace'), 0, 17, 180, 112);
  rect(0, 129, W_, 191, '#2a2030');
  g.fillStyle = 'rgba(20,14,24,.35)'; g.fillRect(0, 17, W_, 112);

  txt('All Under Paw', 90, 84, 8, '#f2ead4', 'center', OUT);
  if (TW) { ['yiren', 'lv', 'zhaoji'].forEach((id, i) => { const c = TW.chars[id]; if (c) { const Wb = W; W = TW; drawPortrait(c, 28 + i * 44, 140, 1); txt(nm(c), 44 + i * 44, 180, 6, '#c8b8a8', 'center', null); W = Wb; } }); }
  txt('前262年，邯郸。', 90, 196, 7, '#c8b8a8', 'center', null);
  txt('押宝一位落魄的秦国质子。', 90, 207, 7, '#c8b8a8', 'center', null);
  const saved = load('w', null);
  btn(40, 222, 100, 22, saved ? '重新开始' : '开始', saved ? 'dark' : 'red', () => { newGame(); state = 'game'; saveGame(); });
  if (saved) btn(40, 250, 100, 22, '继续', 'red', () => { if (loadGame()) state = 'game'; });
  txt('点猫看详情 · 每季两件事', 90, 300, 6, '#8a7a8a', 'center', null);
}
function drawToasts() {
  TOASTS.forEach((t, i) => {
    const a = Math.min(1, t.life * 2), w = Math.min(176, tw(t.s, 7) + 10), y = 22 + i * 12;
    g.globalAlpha = a * .8; rect(R(90 - w / 2), y, R(w), 11, '#16121a'); g.globalAlpha = 1;
    txt(t.s, 90, y + 5.5, 7, t.col, 'center', null, a);
  });
}

// ============================================================ save / load
function saveGame() { if (W && state === 'game') save('w', W); }
function loadGame() {
  const d = load('w', null); if (!d || !d.chars) return false;
  W = d;
  W.cool = W.cool || {}; W.done = W.done || {}; W.news = W.news || []; W.ret = W.ret || []; W.secrets = W.secrets || []; W.queue = W.queue || [];
  for (const c of Object.values(W.chars)) { c.lov = c.lov || []; c.kids = c.kids || []; c.rel = c.rel || {}; c.flags = c.flags || {}; if (c.dead === undefined) c.dead = null; }
  LOOKC.clear(); PORT.clear(); MINI.clear(); SCN.clear();
  return true;
}

// ============================================================ loop
function update(dt) {
  T += dt;
  for (let i = TOASTS.length - 1; i >= 0; i--) { TOASTS[i].life -= dt * (i < TOASTS.length - 3 ? 2 : 1); if (TOASTS[i].life <= 0) TOASTS.splice(i, 1); }
  if (state === 'game') { pumpQueue(); if (W.news.length && TOASTS.length < 3) toast(W.news.shift(), '#f2ead4'); }
  music(dt);
}
function render() {
  TQ.length = 0; HITS = [];
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#0b1020'; ctx.fillRect(0, 0, cv.width, cv.height);
  g.imageSmoothingEnabled = false; g.globalAlpha = 1;
  rect(0, 0, W_, H, '#2a2030');
  if (state === 'title') drawTitle();
  else {
    drawCity();
    for (const m of MODAL) {
      layerBreak();
      if (m.type === 'event') drawEvent(m); else if (m.type === 'sheet') drawSheet(m); else if (m.type === 'family') drawFamily(m);
      else if (m.type === 'pick') drawPick(m); else if (m.type === 'opts') drawOpts(m);
    }
  }
  layerBreak();
  const keepHits = HITS; drawTopBar(); HITS = keepHits;
  drawToasts();
  present();
}
// Text is drawn crisp on top of the pixel layer, so every modal starts a new layer: flush what's below first.
function layerBreak() { present(); g.clearRect(0, 0, W_, H); TQ.length = 0; }

// ============================================================ cover (open index.html#cover, then tools/shot.py -> cover.png)
let shareEl = null, TW = null;
function renderCover() {
  const CW = 320, CH = 180, S = 6, c = mk(CW, CH); g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  W = TW;
  g.drawImage(scene('gate'), 0, 0, 180, 112, 0, 0, 320, 199);
  g.fillStyle = 'rgba(20,14,24,.25)'; g.fillRect(0, 0, CW, CH);
  const cats = ['yiren', 'lv', 'zhaoji'].map(C);
  cats.forEach((ct, i) => { g.fillStyle = OUT; g.fillRect(14 + i * 50 - 1, 96 - 1, 44 + 2, 44 + 2); g.fillStyle = '#e8d4a8'; g.fillRect(14 + i * 50, 96, 44, 44); });
  const big = mk(CW * S, CH * S), bx = big.getContext('2d'); bx.imageSmoothingEnabled = false; bx.drawImage(c, 0, 0, CW * S, CH * S);
  cats.forEach((ct, i) => bx.drawImage(portrait(ct), (14 + i * 50) * S, 96 * S, 44 * S, 44 * S));
  bx.font = '190px ' + FONT; bx.textAlign = 'center'; bx.lineWidth = 26; bx.strokeStyle = '#1b1622'; bx.lineJoin = 'round';
  bx.strokeText('一喵天下', 1300, 470); bx.fillStyle = '#ffe08a'; bx.fillText('一喵天下', 1300, 470);
  bx.font = '64px ' + FONT; bx.lineWidth = 12; bx.strokeText('All Under Paw', 1300, 600); bx.fillStyle = '#f2ead4'; bx.fillText('All Under Paw', 1300, 600);
  bx.font = '52px ' + FONT; bx.strokeText('押宝秦国质子 · 猫猫王朝模拟', 1300, 720); bx.fillText('押宝秦国质子 · 猫猫王朝模拟', 1300, 720);
  document.body.innerHTML = ''; big.style.cssText = 'position:fixed;left:0;top:0;width:1920px;height:1080px'; document.body.appendChild(big);
  document.title = 'COVER READY';
}

// ============================================================ present: pixel layer + crisp text
function present() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = false; ctx.globalAlpha = 1;
  ctx.drawImage(low, 0, 0, W_, H, 0, 0, W_ * K, H * K);
  for (const t of TQ) {
    const c = textSprite(t), tw_ = c.w - 2 * c.pad;
    ctx.globalAlpha = t.alpha; ctx.drawImage(c.cv, R(t.x * K - c.pad - (t.align === 'center' ? tw_ / 2 : t.align === 'right' ? tw_ : 0)), R(t.y * K - c.h / 2));
  }
  ctx.globalAlpha = 1;
}
const TXC = new Map();
function textSprite(t) {
  const key = t.s + '|' + t.size + '|' + t.col + '|' + t.stroke + '|' + K;
  let c = TXC.get(key); if (c) return c;
  if (TXC.size > 600) TXC.clear();
  const m = document.createElement('canvas'), x = m.getContext('2d'), font = t.size * K + 'px ' + FONT;
  const r = t.stroke ? Math.max(.75, t.size * .14) * K : 0, pad = Math.ceil(r) + 2;
  x.font = font; m.width = Math.ceil(x.measureText(t.s).width) + pad * 2; m.height = Math.ceil(t.size * K * 1.5) + pad * 2;
  x.font = font; x.textBaseline = 'middle'; x.textAlign = 'left';
  const oy = m.height / 2;
  if (t.stroke) { x.fillStyle = t.stroke; for (const f of [1, .55]) for (let k = 0; k < 16; k++) { const a = k / 16 * Math.PI * 2; x.fillText(t.s, pad + Math.cos(a) * r * f, oy + Math.sin(a) * r * f); } }
  x.fillStyle = t.col; x.fillText(t.s, pad, oy);
  c = { cv: m, w: m.width, h: m.height, pad }; TXC.set(key, c); return c;
}
try { if (document.fonts) { document.fonts.addEventListener('loadingdone', () => TXC.clear()); document.fonts.ready.then(() => TXC.clear()); } } catch (e) {}
const ALLTEXT = [...new Set((SCRIPT_TEXT.match(/[^\x00-\x7f]/g) || []))].join('') + '0123456789+-/!?';
try { if (document.fonts && document.fonts.load) document.fonts.load('12px "ZCOOL QingKe HuangYou"', ALLTEXT).catch(() => {}); } catch (e) {}

// ============================================================ boot
icons();
newGame(); TW = W; W = null;
/*TEST_HOOK*/
if (location.hash === '#cover') { (document.fonts ? document.fonts.ready : Promise.resolve()).then(renderCover); window.__gameBooted = true; return; }
let last = performance.now(), frameErr = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  try { update(dt); render(); frameErr = 0; }
  catch (e) { if (frameErr++ === 0 && window.__gameErr) window.__gameErr(String(e && e.stack || e).slice(0, 600)); }
  requestAnimationFrame(frame);
}
window.__gameBooted = true;
requestAnimationFrame(frame);
})();
