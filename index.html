function sayLine(c, kind, ok) {

  if (c.tr.includes('高冷') && kind === 'talk') return '「嗯。」';
  const pools = SAY[kind] || SAY.talk;
  if (kind === 'court' || kind === 'propose' || kind === 'hire') return pick(pools[ok ? 1 : 0]);
  if (!ok) return pick(pools[0]);
  const o = opinion(c, P()) + (c.tr.includes('粘人') ? 15 : 0), tier = Math.min(pools.length - 1, o >= 40 ? 2 : o >= 5 ? 1 : 0);
  return pick(pools[tier]);

function react(c, kind, ok, note) {

  MODAL.push({ type: 'talk', c: c.id, line: sayLine(c, kind, ok), note: note ? '学了' + note : '', ok, fx, t0: T });
  if (!ok) SFX.no();
}

  react(c, wed ? 'night' : 'tryst', true);
  if (!wed) {
    // someone's spouse may notice
    for (const x of [p, c]) {
      const sp = x.sp && C(x.sp);
      if (sp && alive(sp) && sp !== p && sp !== c && sameCity(sp, x) && chance(.15 + (sp.tr.includes('多疑') ? .15 : 0))) {
        const sc = W.secrets.find(q => q.type === 'affair' && (q.subj === x.id || q.other === x.id) && !q.exposed);
        if (sc && !sc.known.includes(sp.id)) sc.known.push(sp.id);

function propose(f, c, kind) {

// seasons before a random event can come back (flavour ones carry a longer `cd`)
const RAND_COOL = 16;
function scheduleEvents() {
  if (W.act === 1) for (const [t, id] of HIST) if (t === W.t) W.queue.push({ ev: id });
  runSys('sched');
  if (W.act === 1 && W.t >= 22 && !W.flags.act1Done && !W.queue.some(q => q.ev === 'act1end')) W.queue.push({ ev: 'act1end' });

  if (!W.flags.waiting && chance(.55)) {
    const held = new Set(W.queue.concat(W.later || []).filter(q => q.ev === 'rand').map(q => q.id));
    const pool = RANDOM.filter(r => (!r.ok || r.ok()) && !(r.once && W.done[r.id]) && !W.cool['r_' + r.id] && !held.has(r.id));
    let tot = pool.reduce((s, r) => s + r.w, 0), x = Math.random() * tot;

  }

EV.rand = e => { const r = RANDOM.find(x => x.id === e.id); if (!r || (r.ok && !r.ok())) return null; W.done[r.id] = 1; W.cool['r_' + r.id] = r.cd || RAND_COOL; return r.b(); };
// The order of a season's cards: a new head first, then the story, then the rest, and the 季报 last. Cards nobody needs
// to see this very season (an errand offer, a friend's request or friendship, a random happening) wait a season when a
// story card or two other cards are already there, and at most one of them comes a season.
const STORY_EV = new Set(HIST.map(h => h[1]).concat(['hide', 'act1end', 'zichu']));
const LATER_EV = new Set(['joboffer', 'fask', 'zhiji', 'rand']);
function orderQueue() {
  const Q = W.queue, succ = Q.filter(q => q.ev === 'succession'), story = Q.filter(q => STORY_EV.has(q.ev)), last = Q.filter(q => q.ev === 'jibao');
  const rest = Q.filter(q => q.ev !== 'succession' && !STORY_EV.has(q.ev) && q.ev !== 'jibao'), hard = rest.filter(q => !LATER_EV.has(q.ev)).length;
  const keep = [], later = [];
  for (const q of rest) {
    if (!LATER_EV.has(q.ev)) keep.push(q);
    else if (story.length || hard >= 2 || keep.some(k => LATER_EV.has(k.ev))) later.push(q);
    else keep.push(q);
  }
  W.queue = succ.concat(story, keep, last);
  // (one of each kind waits at most: a newer one replaces it)
  for (const q of later) W.later = (W.later || []).filter(x => x.ev !== q.ev).concat([q]);
}

// ---------------------------------------------------------- succession
// The heir (heirNow: the head's pick or the law's) comes first, in gold, then up to 3 more by custom (succCands);
// '其他人…' opens the whole clan. The new head is set up in takeOver (growth's 家法: prestige, regency, grief).
EV.succession = () => {
  const old = P(); if (!old) return null;
  let cands = succCands(old).map(x => x[0]);
  if (!cands.length) {
    const g = randGenome(Math.random, 'M');
    const c = mkc({ sur: '狸', name: pick(GIV_M), born: W.t - 4 * 20, house: 'li', loc: 'home', role: 'merchant', g });
    cands = [c];
    logLine('狸家没有后人了。族里从乡下请来一个远房侄子。', '#f2ead4');
  }
  const h = heirNow(old);
  let show = (h ? [h] : []).concat(cands.filter(c => c !== h)).slice(0, 4);
  // if the list is all children while a grown relative exists, offer the best grown one too
  if (show.every(c => ageOf(c) < 16)) { const ad = cands.find(c => ageOf(c) >= 16); if (ad && !show.includes(ad)) show = show.slice(0, 3).concat([ad]); }
  const rest = cands.filter(c => !show.includes(c));
  const O = show.map(c => Object.assign(opt(nm(c) + '（' + ageOf(c) + '岁 ' + (c.female ? '女' : '男') + '）',
    (c === h ? '嗣 · ' : '') + traitsOf(c).slice(0, c === h ? 2 : 3).join(' ') + ' · ' + STATN.map((s, i) => s + stat(c, i)).join(' '), () => takeOver(old, c, h)), { look: c === h ? 'gold' : null }));
  // the picker holds the queue; backing out of it brings this card back (the card is queued again first)
  if (rest.length) O.push(opt('其他人…', '还有 ' + rest.length + ' 人', () => {
    W.queue.unshift({ ev: 'succession' });
    pickChar('谁来当家？', cands, c => { W.queue = W.queue.filter(q => q.ev !== 'succession'); takeOver(old, c, h); }, succInfo(old, h));
    const m = top(); if (m && m.type === 'pick') m.hold = true;
  }));
  const why = !h ? '' : W.law === '择贤' && W.heirId === h.id ? `${ta(old)}生前立了${nm(h)}为嗣。` : `按规矩，该是${nm(h)}。`;
  return { title: '家主', who: [old.id], big: true, text: `${nm(old)}${old.flags.cause || '去世了'}，享年${ageOf(old)}岁。狸家要有新的家主。` + why, opts: O };
};

// ==== SYS:career ==== 功名 · 家业
// 太阁's half of the game. A patron hands out errands (差事) that you finish with the actions you already have; errands,
// advice and service earn 功 (merit); merit, fame and a patron's favour open the next rank, and a rank pays a salary.
// Money has somewhere to go: 置产 (estates that pay every season), 名物 (treasures: fame, a sharper skill, the best
// gifts) and 大计 (decisions: a feast, a family register, a house motto, asking for office).
// For other systems (call with a typeof guard): addMerit(n, why), prestTier() → { i, n, op }, hasItem(id), gainItem(id, why),
// laterItem(id, seasons, why), estateIncome(); state W.merit, W.patron, W.job, W.items, W.estates. ACT2/3 push into JOBS
// (errands), PROMO (ranks: { to, ev, ok(), need() }) and DECISIONS (大计 rows).

// ---------------------------------------------------------- merit, rank, fame
const SALARY = [0, 6, 20, 40, 60, 100, 150];
// the merit a rank stands on (a missed errand never takes you below it); the next rank's need fills the card's bar
const RANK_NEED = [0, 0, 60, 150, 300, 500, 800];
function addMerit(n, why, quiet) {
  n = R(n || 0); if (!n || !W) return;

  W.merit = n > 0 ? m + n : Math.max(Math.min(m, RANK_NEED[W.rank] || 0), m + n);
  if (!quiet) toast('功 ' + (n > 0 ? '+' : '') + n + (why ? ' · ' + why : ''), n > 0 ? '#ffd24a' : '#ff9a8a');
}
// fame in tiers, as in CK3: what everyone thinks of you (opinion) and how readily a family says yes (proposeChance)
const PTIER = [[0, '无名', 0, '#a89888'], [50, '有名', 5, '#9dbbd6'], [150, '名士', 10, '#9fe89a'], [300, '望族', 15, '#f0cc5c'], [500, '名动天下', 20, '#ffa07a']];

  return { i, n: PTIER[i][1], op: PTIER[i][2], col: PTIER[i][3], next: i + 1 < PTIER.length ? PTIER[i + 1][0] : null };
}

const cutS = s => fitT(s, 90, 5.5, 1);

// ---------------------------------------------------------- patron
// Who you serve: 异人 makes you his 舍人 (and writes from 咸阳 after act one); in 邯郸 平原君 takes on anyone he thinks
// well of; a 客卿 answers to the court; failing all of them, whichever lord in town likes you best (30+).
// The story acts set the king (W.patron = id).
const patron = () => { const c = W.patron && C(W.patron); return alive(c) ? c : null; };

// merchant without a rank (舍人) and for a 舍人 without a patron is a lord at 30+.
const LORD_OP = 30;

  for (const c of Object.values(W.chars)) {
    if (!inCity(c) || !lordly(c) || c.role === 'ruler' || c.loc === 'home' || c.house === 'li' || c.house === 'in' || ageOf(c) < 16) continue;
    const v = opinion(c, p); if (v > bv) { bv = v; best = c; }

function patronLost(c) {

  return o < -20;

const patronBack = c => !patronLost(c) && opinion(c, P()) >= 0;
function updPatron() {
  // (a king serves nobody)
  if (W.kingId && W.kingId === W.player) { W.patron = null; return; }
  const pa = W.patron && C(W.patron);
  if (W.patron && (!alive(pa) || patronLost(pa))) {
    if (W.job && W.job.from === W.patron) endJob(false, alive(pa) ? nm(pa) + '不再找你' : '人不在了');
    if (alive(pa)) { logLine(nm(pa) + (inCity(pa) ? '不再照拂你' : '不再给你来信'), '#ff9a8a'); W.flags.lostPa = pa.id; }

  const yr = C('yiren'), py = C('pingyuan'), k = cityRuler(), p = P(), was = W.flags.lostPa;
  if (W.rank < 2 && alive(yr) && !patronLost(yr) && (!W.flags.act1Done || opinion(yr, p) >= 20)) W.patron = 'yiren';
  else if (inCity(py) && opinion(py, p) >= 20) W.patron = 'pingyuan';
  else if (W.rank >= 2 && alive(k) && k !== p && patronBack(k)) W.patron = k.id;
  else if (W.rank < 2) { const b = bestLord(); if (b && b[1] >= LORD_OP) { W.patron = b[0].id; if (b[0].id !== was) logLine(nm(b[0]) + '把你收在了门下', '#c8e0ff'); } }
  if (W.patron && W.patron === was) { logLine(nm(C(was)) + '又肯见你了', '#9fe89a'); delete W.flags.lostPa; }

// ---------------------------------------------------------- 差事 (errands)

// you do it), due (seasons) or dueT (a fixed turn), goal { kind: didAct kind(s), target: ids | 'giver' | j => ids,
// n: times, any: failed tries count too }, check(j) → true | 'fail' for errands that are a state (备金), acts(c, j) /
// tabs(tab, j): the extra (gold) buttons it brings, reward { merit fish prest heir op fn }, ok(giver), pre(queued offer,
// giver): pick a target (q.tgt), init(j): note the state when taken on, letter: comes by post (the giver may be in

// W.job = { id, from (the giver's id), tgt, t0, due (turn), n (times done) }.
const yrHostage = () => { const y = C('yiren'); return inCity(y) && y.loc === 'hostage' && !W.flags.escapeLead; };

const zhengHome = () => { const z = C('zheng'); return z ? [z, C(z.mom)].filter(x => inCity(x) && x.id !== W.player && x.loc !== 'home').map(x => x.id) : []; };

function friendTarget(gv) {
  const p = P(), gid = gv ? gv.id : null, L = [];

const jobGoTxt = (j, d) => { const c = jobGoWho(j); return c ? '去找' + nm(c) : TABS[d.tab] ? '去「' + TABS[d.tab].n + '」' : ''; };

// ---------------------------------------------------------- promotion

];

// ==== SYS:social ==== 人情 · 活的世界
// 挚友 and 宿敌 are tags on a relation, set both ways (rel.tag); other code may still set a one-way 'rival' tag, so the
// checks look at both sides. On a cat's relation toward you: n counts what you have done together (didAct), hi / lo the
// seasons in a row they have liked you ≥60 / hated you ≤−50, lc a lover's cold seasons.
// W.soc: pid (the head these lists belong to), rv (rivals already announced), ym (rivals already beaten), debt (a loan
// from 郭纵), owe (who holds an unpaid debt over you — intrigue may turn it into a weak hook), shield (鲁仲连's 说情),
// proxy (毛遂's 代辩), guard (廉颇's men stay until this turn), xl (信陵君's door for the next caravan), fav1 (favours
// already used once), ask (rotates the kinds of favours friends ask).
const relTag = (a, b) => { const r = a && b && a.rel[b.id]; return r ? r.tag : undefined; };
function isFriend(a, b) { return !!a && !!b && a !== b && (relTag(a, b) === 'friend' || relTag(b, a) === 'friend'); }
function isRival(a, b) { return !!a && !!b && a !== b && (relTag(a, b) === 'rival' || relTag(b, a) === 'rival'); }
function tagBoth(a, b, t) {
  for (const [x, y] of [[a, b], [b, a]]) { const r = t ? rel(x, y) : x.rel[y.id]; if (!r) continue; if (t) r.tag = t; else delete r.tag; delete r.hi; delete r.lo; }
}
function befriend(a, b) { if (a && b && a !== b) tagBoth(a, b, 'friend'); }
function makeRival(a, b) { if (a && b && a !== b) tagBoth(a, b, 'rival'); }
// 鲁仲连's 说情: the next rumour or impeachment against you goes nowhere (whoever raises it calls this first)
function useShield() { const S = W && W.soc; if (!S || !S.shield) return false; S.shield = 0; logLine('鲁仲连替你说了话，这件事没闹起来', '#c8e0ff'); return true; }
// 廉颇's old soldiers watch the house for a year: the next thief, search or knife in the night meets them, once
// (guarded() asks; useGuard() is called where they actually step in, and sends them home)
function guarded() { const S = W && W.soc; return !!S && S.guard > W.t && alive(C('lianpo')); }
function useGuard() { if (!guarded()) return false; W.soc.guard = 0; logLine('廉颇的老兵挡了这一回，回营去了', '#c8e0ff', true); return true; }
// 毛遂 speaks for you in the next 舌战 (it is used up when a 'debate' is reported through didAct)
function proxyDebater() { const S = W && W.soc, c = S && S.proxy && C(S.proxy); return alive(c) ? c : null; }
const maxFriends = p => 3 + (p && p.tr.includes('好客') ? 1 : 0);
function friendsOf(p) { const out = []; if (p) for (const k in p.rel) if (p.rel[k].tag === 'friend') { const o = C(k); if (alive(o)) out.push(o); } return out; }
function rivalIds(p) { const out = []; if (p) for (const c of Object.values(W.chars)) if (alive(c) && c !== p && c.rel[p.id] && c.rel[p.id].tag === 'rival') out.push(c.id); return out; }
// everyone on either side of a feud with p (what the 人情 list and count show)

// (the three of the 立嗣 race stay out of friendships until it is over: that race is tuned on its own)
const raceThree = c => ['yiren', 'lv', 'zhaoji'].includes(c.id) && !W.flags.act1Done;
// stress relief that works with Phase 1's 0–3 心烦 and with growth's 0–100 (growth brings hasPerk and addStress(c, n, why))
function relieve(c, n, why) { if (!c) return; if (typeof hasPerk === 'function') addStress(c, -n, why); else c.stress = Math.max(0, (c.stress || 0) - (n >= 25 ? 2 : 1)); }

const socFresh = () => ({ pid: null, rv: [], ym: [], debt: null, owe: null, oweN: 0, bad: {}, lent: [], shield: 0, proxy: null, guard: 0, xl: 0, fav1: {}, ask: 0 });

// ==== SYS:intrigue ==== 计谋 · 把柄 · 门下
// Plots take seasons instead of one roll: progress, secrecy (a chance each season to be found out) and helpers who hate
// the same cat. Rivals plot back, unseen until you find them out. A secret you know, or a favour owed, is a hook (weak:
// one use; strong: again every 8 seasons). 门下: four seats with two tasks each, for retainers and grown kin.
// For the other systems (call through typeof): councilSeat(name), holdsHook(id), startScheme(type, target, opt),
// W.schemes, W.hooks; also giveHook(id, k, why) and exposeSec(secret, byId).
const hasPerkF = n => typeof hasPerk === 'function' && !!hasPerk(n);
const isFriendF = (a, b) => typeof isFriend === 'function' ? !!isFriend(a, b) : !!(a && b && a.rel[b.id] && a.rel[b.id].tag === 'friend');
const isRivalF = (a, b) => typeof isRival === 'function' ? !!isRival(a, b) : !!(a && b && a.rel[b.id] && a.rel[b.id].tag === 'rival');
// (turning a friend into an enemy is a betrayal they don't forget: social's 背叛, since its own check sees the new tag)
function mkRival(a, b) { if (!alive(a) || !b || a === b || a.id === W.player) return; if (b.id === W.player && isFriendF(a, b)) addMemo(a, b, '背叛', -60); if (typeof makeRival === 'function') makeRival(a, b); else rel(a, b).tag = 'rival'; }
function mkFriend(a, b) { if (typeof befriend === 'function') befriend(a, b); else { rel(a, b).tag = 'friend'; rel(b, a).tag = 'friend'; } }

// ---------------------------------------------------------- 门下: four seats, two tasks each (s = the seated cat's stat)
const SEATS = [
  { n: '家丁头', st: 0, t: ['护院', '押镖'], e: [s => ['-' + R(guardCut(s) * 100) + '%', '捉贼必胜 · 刺客得手 -' + R(guardCut(s) * 100) + '%'], s => ['+' + 3 * s + '%', '跑商队多赚 ' + 3 * s + '%']] },
  { n: '账房', st: 1, t: ['管账', '节用'], e: [s => ['+' + s, '每季鱼干 +' + s + estX(s)], s => ['-' + Math.min(30, 2 * s) + '%', '家用和门客开销 -' + Math.min(30, 2 * s) + '%' + estX(s)]] },
  { n: '说客', st: 2, t: ['交游', '游说'], e: [() => ['+2', '每季两位权贵好感 +2'], s => raceLobby() ? ['+' + lobbyGain(s), '你每遣使一回，立嗣再 +' + lobbyGain(s)] : ['+' + swayGain(s), '你的私事计谋每季 +' + swayGain(s) + (raceOn() ? ' · 立嗣还用不上' : '')]] },
  { n: '耳目', st: 3, t: ['打听', '防备'], e: [s => [Math.min(30, 2 * s) + '%', '每季 ' + Math.min(30, 2 * s) + '% 探得一件秘密'], s => ['-' + s, '暗算每季 -' + s + ' · 察觉 ' + s + '%']] },
];
// (either way a 账房 keeps the estates' books: they pay ×(1 + 政/20), see career's estMult)
const estX = s => typeof estKinds === 'function' && estKinds().length ? ' · 产业×' + (1 + s / 20).toFixed(2) : '';
// in act one a 说客 on 游说 goes along with each envoy you send to 咸阳 (+交/LOBBY_DIV to it: the seat alone moves
// nothing, your fish and energy still do the work); growth's 说客 perk (遣使、游说 +25%) makes both kinds go further
const LOBBY_DIV = 8;
const raceOn = () => W.act === 1 && !W.flags.act1Done && W.heir < 100;
const raceLobby = () => raceOn() && !!W.flags.knowHuayang && alive(C('yiren')) && opinion(C('yiren'), P()) >= 25;
const sayK = () => hasPerkF('说客') ? 1.25 : 1;
const lobbyGain = s => Math.floor(s / LOBBY_DIV * sayK());
// a seat filled for the first time starts on the task that matters now (the race, while it runs)
const defTask = n => n === '说客' && raceOn() ? 1 : 0;
const swayGain = s => R(s * sayK());
// 护院 cuts a killer's odds by 3% per point of 武 (at most by 60%); s given = for the hint, else the seated guard now
const guardCut = s => Math.min(.6, .03 * (s === undefined ? (seatOn('家丁头', 0) ? seatS('家丁头') : 0) : s));
// retainers and grown members of the household (spouse too) can sit; the head can't
function seatOk(c) { return alive(c) && c.id !== W.player && c.loc === 'home' && ageOf(c) >= 16 && (W.ret.includes(c.id) || household().includes(c)); }
function councilSeat(name) { const s = W && W.council && W.council[name], c = s && s.id ? C(s.id) : null; return c && seatOk(c) ? c : null; }
const seatDef = n => SEATS.find(S => S.n === n);
const seatS = n => { const c = councilSeat(n); return c ? stat(c, seatDef(n).st) : 0; };
const seatOn = (n, k) => !!councilSeat(n) && (W.council[n].task || 0) === k;
const seatOf = c => c && W.council ? SEATS.find(S => W.council[S.n] && W.council[S.n].id === c.id) || null : null;
const seatCands = () => adults(household()).concat(W.ret.map(C)).filter((c, i, a) => a.indexOf(c) === i && seatOk(c));
function unseat(n) {
  const cur = W.council[n]; if (!cur || !cur.id) return;
  const c = C(cur.id), p = P(), r = c && p && c.rel[p.id];
  if (r && r.m) { r.m = r.m.filter(x => x.k !== '受重用'); if (!r.m.length) delete r.m; }
  cur.id = null;
}
// a retainer just hired sits in the seat of their best stat if it is empty
function autoSeat(c) {
  if (!W.council || seatOf(c) || !seatOk(c)) return;
  const S = SEATS.slice().sort((a, b) => stat(c, b.st) - stat(c, a.st))[0];
  if (S && !councilSeat(S.n)) setSeat(S.n, c);
}
function setSeat(n, c) {
  const cur = W.council[n] || (W.council[n] = { id: null, task: defTask(n) });
  unseat(n); if (!c) return;
  const o = seatOf(c); if (o) unseat(o.n);
  cur.id = c.id; addMemo(c, P(), '受重用', 5);
  logLine(nm(c) + '做了你的' + n, '#9fe89a'); SFX.happy();
}

// ---------------------------------------------------------- hooks: W.hooks[id] = { k: 'weak'|'strong', cd: turn it can be used again, sid, fav }
