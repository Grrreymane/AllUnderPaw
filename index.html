// ============================================================ economy / checks / helpers

function addPrest(n) { W.prest = clamp(W.prest + n, 0, 999); if (n) toast('名望 ' + (n > 0 ? '+' : '') + n, n > 0 ? '#c8e0ff' : '#ff9a8a'); }

const STRESS_T = { 仁厚: 20, 诚实: 15, 专一: 10, 胆小: 15, 勇猛: 10, 多疑: 10 };

function addStress(c, n, why) {

}
// for hints: what a choice costs in 心烦 given your traits ('' when nothing), and a hint with that cost appended
const stressTip = (...trs) => { const p = W && P(), t = p ? trs.filter(x => p.tr.includes(x)) : []; return t.length ? '心烦+' + t.reduce((s, x) => s + (STRESS_T[x] || 15), 0) + '（' + t.join(' ') + '）' : ''; };

// 心烦 levels, shown as pips: 1 at 34, 2 at 67 (四项-1), 3 at 100 (四项-2, 健康-1/季, and the breakdown)

function chk(i, dc) { return Math.random() < pct(stat(P(), i), dc); }
const chkHint = (i, dc) => STATN[i] + ' ' + R(pct(stat(P(), i), dc) * 100) + '%';
function addHealth(c, n) { if (c) c.health = clamp((c.health || 0) + n, 0, 100); }

const family = () => Object.values(W.chars).filter(c => c.house === 'li' && alive(c));
// who lives under your roof and eats from the store: 狸 and married-in spouses at home, minus those who walked out or set up their own house
const household = () => Object.values(W.chars).filter(c => alive(c) && c.loc === 'home' && (c.house === 'li' || c.house === 'in') && !c.flags.left && !c.flags.branch);

  }

  // the new head is chosen before any other news of the same season
  { const i = W.queue.findIndex(q => q.ev === 'succession'); if (i > 0) W.queue.unshift(W.queue.splice(i, 1)[0]); }

function lifeTick() {
  const all = Object.values(W.chars);
  // cadet branches have fewer children as the clan grows (full rate up to 30 living 狸, none from 50): the far ends of a
  // big clan stop being the house's business, and the 人 list stays readable
  const brK = clamp((50 - family().length) / 20, 0, 1);
  for (const c of all) {
    if (!alive(c)) continue;
    const age = ageOf(c);
    // the history books decide when the famous die
    if (histDue(c)) { die(c, HIST_GONE.has(c.id)); continue; }
    // births; a mother doesn't conceive again in the season she gives birth
    const due = c.preg && W.t >= c.preg.due;
    if (due) giveBirth(c);
    // new pregnancies (only for cats the story cares about; a cadet branch only while it is still close kin of the head)
    if (!due && c.female && !c.preg && !c.flags.barren && age >= 16 && age <= 40 && relevant(c) && (!c.flags.branch || branchNear(c))) {
      let partners = [];
      const sp = c.sp && C(c.sp);
      if (alive(sp) && sameCity(sp, c)) partners.push([sp, c.flags.branch || sp.flags.branch ? .03 * brK : .08]);
      for (const l of c.lov) { const o = C(l); if (alive(o) && sameCity(o, c) && !o.female) partners.push([o, c.flags.branch || o.flags.branch ? .02 * brK : .05]); }
      // historical figures only have the children history gives them, unless the father is you or a 狸
      if (c.hist) partners = partners.filter(([f]) => f.id === W.player || f.house === 'li');
      const nk = c.kids.length, fert = (age > 34 ? .5 : 1) * (nk >= 4 ? .35 : nk >= 2 ? .7 : 1);
      for (const [f, p] of partners) if (!f.female && ageOf(f) >= 16 && chance(p * fert)) { setPreg(c, f.id); break; }
    }
    // coming of age
    if (age === 16 && (W.t - c.born) % 4 === 0 && c.house === 'li') comeOfAge(c);
    // fur settles at age one: odd colours may betray a secret
    if (age === 1 && (W.t - c.born) % 4 === 0 && c.bio && c.dad && c.bio !== c.dad && c.mom) furCheck(c);
    // death (a mother carrying 政 is safe until he is born)
    if (!c.immortal && age >= 16 && !(c.preg && c.preg.id === 'zheng')) {
      let yr = age < 40 ? .006 : age < 50 ? .015 : age < 60 ? .04 : age < 70 ? .09 : .2;
      const cg = congenital(c).map(t => t.n);
      if (cg.includes('孱弱')) yr *= 2; else if (cg.includes('体弱')) yr *= 1.5; else if (cg.includes('健壮') || cg.includes('虎背熊腰')) yr *= .7;
      if (cg.includes('先天不足')) yr *= 1.6;
      if (c.health < 40) yr *= 2;
      if (chance(yr / 4)) { die(c); continue; }
    }
    if (c.health < 75 && chance(c.flags.postpartum > W.t ? .2 : .5)) addHealth(c, 1);
    npcAffair(c);
    runSys('life', c);
  }
}

// seasons before a random event can come back (flavour ones carry a longer `cd`)
const RAND_COOL = 16;
function scheduleEvents() {
  if (W.act === 1) for (const [t, id] of HIST) if (t === W.t) W.queue.push({ ev: id });
  runSys('sched');
  if (W.act === 1 && W.t >= 22 && !W.flags.act1Done && !W.queue.some(q => q.ev === 'act1end')) W.queue.push({ ev: 'act1end' });
  if (W.flags.siege && W.t === 21) W.flags.siegeOver = true;
  const yr = C('yiren');
  if (!W.cool.sheren && W.rank === 0 && alive(yr) && yr.loc === 'hostage' && !W.flags.escapeLead && opinion(yr, P()) >= 35) W.queue.push({ ev: 'sheren' });
  if (chance(.55)) {
    const pool = RANDOM.filter(r => (!r.ok || r.ok()) && !(r.once && W.done[r.id]) && !W.cool['r_' + r.id]);
    let tot = pool.reduce((s, r) => s + r.w, 0), x = Math.random() * tot;
    for (const r of pool) { x -= r.w; if (x <= 0) { W.queue.push({ ev: 'rand', id: r.id }); break; } }
  }
}
EV.rand = e => { const r = RANDOM.find(x => x.id === e.id); if (!r || (r.ok && !r.ok())) return null; W.done[r.id] = 1; W.cool['r_' + r.id] = r.cd || RAND_COOL; return r.b(); };

// ---------------------------------------------------------- succession
// The heir (heirNow: the head's pick or the law's) comes first, in gold, then up to 3 more by custom (succCands);
// '其他人…' opens the whole clan. The new head is set up in takeOver (growth's 家法: prestige, regency, grief).
EV.succession = () => {
  const old = P(); if (!old) return null;
  let cands = succCands(old).map(x => x[0]);
  if (!cands.length) {
    const g = randGenome(Math.random, 'M');
    const c = mkc({ sur: '狸', name: pick(GIV_M), born: W.t - 4 * 20, house: 'li', loc: 'home', role: 'merchant', g });
    cands = [c];
    logLine('狸家没有后人了。族里从乡下请来一个远房侄子。', '#f2ead4');
  }
  const h = heirNow(old);
  let show = (h ? [h] : []).concat(cands.filter(c => c !== h)).slice(0, 4);
  // if the list is all children while a grown relative exists, offer the best grown one too
  if (show.every(c => ageOf(c) < 16)) { const ad = cands.find(c => ageOf(c) >= 16); if (ad && !show.includes(ad)) show = show.slice(0, 3).concat([ad]); }
  const rest = cands.filter(c => !show.includes(c));
  const O = show.map(c => Object.assign(opt(nm(c) + '（' + ageOf(c) + '岁 ' + (c.female ? '女' : '男') + '）',
    (c === h ? '嗣 · ' : '') + traitsOf(c).slice(0, c === h ? 2 : 3).join(' ') + ' · ' + STATN.map((s, i) => s + stat(c, i)).join(' '), () => takeOver(old, c, h)), { look: c === h ? 'gold' : null }));
  // the picker holds the queue; backing out of it brings this card back (the card is queued again first)
  if (rest.length) O.push(opt('其他人…', '还有 ' + rest.length + ' 人', () => {
    W.queue.unshift({ ev: 'succession' });
    pickChar('谁来当家？', cands, c => { W.queue = W.queue.filter(q => q.ev !== 'succession'); takeOver(old, c, h); }, succInfo(old, h));
    const m = top(); if (m && m.type === 'pick') m.hold = true;
  }));
  const why = !h ? '' : W.law === '择贤' && W.heirId === h.id ? `${ta(old)}生前立了${nm(h)}为嗣。` : `按规矩，该是${nm(h)}。`;
  return { title: '家主', who: [old.id], big: true, text: `${nm(old)}去世了，享年${ageOf(old)}岁。狸家要有新的家主。` + why, opts: O };
};

// other systems ask for perks with typeof hasPerk === 'function' && hasPerk('铺面')
function hasPerk(name) {
  const p = W && P(); if (!p || !p.focus) return false;
  const i = p.focus.i, k = FOCUS[i] && FOCUS[i].perks.find(x => x[0] === name);
  return !!k && p.st[i] >= k[1];
}
function openFocus() {
  const p = P(); if (!alive(p)) return;
  openList('立志', () => FOCUS.map((f, i) => {
    const cur = p.focus && p.focus.i === i, wait = p.focus ? p.focus.t + FOCUS_CD - W.t : 0;
    return { dot: STATC[i], t: f.n + ' · ' + STATN[i] + ' ' + p.st[i], s: f.perks.map(k => k[0] + (cur && p.st[i] >= k[1] ? '✓' : k[1])).join(' '),
      // the row itself tells what the three perks do

const XP_KIND = { trade: 1, caravan: 1, advise: 1, counsel: 1, policy: 1,
  talk: 2, gift: 2, pay: 2, court: 2, propose: 2, match: 2, feast: 2, banquet: 2,
  spy: 3, ask: 3, venture: 3, blackmail: 3, expose: 3, scheme: 3, plot: 3, sway: 3, seduce: 3, fabricate: 3, alienate: 3, murder: 3,
  duel: 0, guard: 0, escort: 0, army: 0, campaign: 0, battle: 0 };
// +1 per use, +1 more on success — for the ones that can fail; these never do, so they give +1 (keeps the 立嗣 race and
// the economy where the balance harness put them)
const XP_SURE = new Set(['trade', 'caravan', 'talk', 'gift', 'pay', 'feast', 'banquet', 'expose']);
let GFX = null;   // { i, t0 }: the star over a stat that just went up (not saved)
function gainXp(c, i, n) {
  if (!c || !(i >= 0 && i <= 3) || !n) return;
  c.xp = c.xp || [0, 0, 0, 0];
  if (c.st[i] >= XP_CAP) { c.xp[i] = 0; return; }   // practice alone goes no further
  c.xp[i] += n * (c.focus && c.focus.i === i ? 1.5 : 1);
  const need = 6 + c.st[i];
  if (c.xp[i] >= need) {
    c.xp[i] = c.st[i] + 1 >= XP_CAP ? 0 : c.xp[i] - need; c.st[i]++;
    if (c.id === W.player) { toast(STATN[i] + ' +1', '#ffe08a'); SFX.happy(); GFX = { i, t0: T }; }
  }
}

// ---------------------------------------------------------- 家法: the heir, the law, succession and regency
const LAWN = { 嫡长: '立嫡长', 择贤: '择贤' }, HEIRC = '#9a7424';
// by custom: children, then grandchildren, siblings, siblings' children, other 狸; parents last (never "by custom");

function succRank(old) {

  return c => {
    let r = childOf(c, old) ? 0 : [c.dad, c.mom].some(id => childOf(C(id), old)) ? 1 : sib(c) ? 2
      : [c.dad, c.mom].some(id => { const x = C(id); return x && sib(x); }) ? 3 : childOf(old, c) || c.id === W.flags.elder ? 9 : 4;

// [cat, rank] for every living 狸 but the head, best first
function succCands(old) {

    .sort((a, b) => a[1] - b[1] || (ageOf(b[0]) >= 16) - (ageOf(a[0]) >= 16) || (a[0].female - b[0].female) || a[0].born - b[0].born);

  return c => { const r = rk(c); return { txt: c === h ? '嗣' : r >= 9 ? '长辈' : r >= 5 ? (c.flags.disinh ? '已废' : '离家') : RN[r], col: c === h ? HEIRC : '#5f5236', v: c === h ? 1 : -r }; }; };

// floating notices: at most 3 on screen, the rest wait their turn (nothing is dropped). Each layer sets TANCH to a

const TOASTS = [], TPEND = [];
let TANCH = [64, 1];
function toast(s, col) {
  s = String(s);
  const same = TOASTS.find(t => t.s === s); if (same) { same.life = Math.max(same.life, 1.6); return; }

  if (TPEND.length > 60) TPEND.shift();   // only a script firing hundreds of notices without frames gets here
}

// ============================================================ modals (event, character sheet, family, pickers)
const MODAL = [];
let state = 'title', T = 0;
const busy = () => MODAL.length > 0 || (W && W.queue.length > 0);
// a story card, the guide, a conversation card or a system window marked `hold` is up: the queue and the notices wait
const holding = () => MODAL.some(m => m.type === 'event' || m.type === 'tour' || m.type === 'talk' || m.hold);
function top() { return MODAL[MODAL.length - 1]; }
const drop = m => { const i = MODAL.indexOf(m); if (i >= 0) MODAL.splice(i, 1); };
// a new or loaded game starts with no windows, notices or scroll positions left from the last one
function resetScreen() { MODAL.length = 0; TOASTS.length = 0; TPEND.length = 0; PEOPLE_SCR.key = ''; SCR = NOSCR; }
function closeTop() { MODAL.pop(); }
// ro: only to look at (opened from a picker or a story card): no actions except 族谱
function openSheet(id, ro) { MODAL.push({ type: 'sheet', id, ro: !!ro }); SFX.page(); }
function openFamily(focus, ro) { MODAL.push({ type: 'family', focus: focus || null, ro: !!ro }); }
// info(c) -> { txt, col } is shown where the opinion number usually is (e.g. a marriage chance); tapping a portrait
// opens that cat's card to look at before choosing
// (when info also gives a number v, the rows are shown best first)
function pickChar(title, list, fn, info) {
  if (!list.length) { toast('没有合适的人选', '#dddddd'); return; }
  const v = c => { const r = info && info(c); return r && typeof r.v === 'number' ? r.v : 0; };
  MODAL.push({ type: 'pick', title, list: list.map(c => c.id), show: info ? list.slice().sort((a, b) => v(b) - v(a)).map(c => c.id) : null, fn, info });
}
// '成 N%' for marriage pickers (pc = c => proposeChance(…)); the best chances come first
const chanceInfo = pc => c => { const v = pc(c); return { txt: '成' + R(v * 100) + '%', v, col: v >= .6 ? '#276a32' : v >= .3 ? '#5f5236' : '#a0301f' }; };
// opts: [{ n, fn, s (subtitle), style }]
function pickOpt(title, opts) { MODAL.push({ type: 'opts', title, opts }); }
// A scrolling list window. rows (an array, or a function returning one so it stays live):
// { por: cat, icon: canvas, dot: colour, t, s, right, col, wrap, fn, act: action, close } ; opt { close, empty, sub, onClose }
function openList(title, rows, opt) { MODAL.push({ type: 'list', title, rows, opt: opt || {} }); SFX.page(); }
// an event-style card shown now instead of through the queue (a system's own result / decision card)
function showCard(e) { if (e && W) showEvent(e); }
function showEvent(e) {

  const mine = traitsOf(P()), seen = new Set();
  e.opts = (e.opts || []).filter(o => (!o.tr || mine.includes(o.tr)) && !seen.has(o.t) && seen.add(o.t));

}

const RACE_TIP = '上两条是异人对你、对吕不韦的好感。立嗣条金色是你的功劳，紫色是吕的。出城那夜谁出金子也算功劳，第一幕结束时谁多谁记头功。';
function pumpQueue() {
  // story cards also wait for a conversation card (so its line and heart are seen) and for a system's hold window
  if (!W || holding()) return;
  if (!W.queue.length && !MODAL.length && !W.flags.tourDone && W.flags.elder) { W.loc = 'home'; MODAL.push({ type: 'tour', i: 0 }); return; }
  // the 立嗣 race widget gets a one-step introduction the first time it matters
  if (!W.queue.length && !MODAL.length && W.flags.tourDone && W.flags.metYiren && !W.flags.raceTip && W.act === 1 && !W.flags.act1Done && alive(C('yiren'))) {
    W.flags.raceTip = true; W.loc = 'home'; MODAL.push({ type: 'tour', i: 0, steps: [[[118, 19, 59, 45], RACE_TIP.replace(/异人/g, nm(C('yiren')))]] }); return;
  }
  while (W.queue.length) {
    const q = W.queue.shift(), b = EV[q.ev];
    const e = b ? b(q) : null;
    if (e) { showEvent(e); return; }
  }
}
function choose(m, o) {
  if (o.ok && !o.ok()) { SFX.no(); toast((o.no && o.no()) || '条件不够', '#ff9a8a'); return; }
  MODAL.splice(MODAL.indexOf(m), 1);
  o.fx && o.fx();
  if (m.e.post) m.e.post();
  saveGame();
}

  for (const [id, y] of [['weizhao', 325], ['xuan', 345], ['zixi', 284]]) { const c = C(id); if (c) c.born = bornAt(y); }
  // 政 doesn't live in your house (older saves put him there when you were his mother)
  { const z = C('zheng'); if (alive(z) && z.loc === 'home' && z.house !== 'li') z.loc = W.t >= 46 ? 'xianyang' : 'hostage'; }
  // 廉颇 came home after 长平; 赵括 died there
  { const l = C('lianpo'); if (alive(l) && l.loc === 'away' && W.t >= 8) l.loc = 'palace'; }
  // a history that has run on past a ruler's death: the successors
  for (const id of ['zhaowang', 'daoxiang']) { const c = C(id); if (c && !alive(c) && HIST_NEXT[id]) HIST_NEXT[id](c); }
}

// ============================================================ loop
function update(dt) {
  T += dt;
  // a conversation card leaves by itself after a while; windows from systems may animate (m.upd)
  for (const m of MODAL.slice()) { if (m.type === 'talk' && T - m.t0 > 3.2) drop(m); else if (m.upd) m.upd(dt); }
  // notices wait while a story card, the guide, a conversation or a hold window is on screen, so they never cover it;
  // three at a time, and they go faster while more are waiting
  if (!holding()) {
    while (TOASTS.length < 3 && TPEND.length) TOASTS.push(TPEND.shift());
    const sp = 1 + Math.min(2, TPEND.length * .3);
    for (let i = TOASTS.length - 1; i >= 0; i--) { TOASTS[i].life -= dt * sp; if (TOASTS[i].life <= 0) TOASTS.splice(i, 1); }
  }
  if (state === 'game') { pumpQueue(); if (W.news.length && !TPEND.length && TOASTS.length < 3) toast(W.news.shift(), '#f2ead4'); }
  music(dt);
}
// the built-in windows; a system adds its own kinds with SYS.modal[type] = draw(m) (and m.upd(dt) if it animates;
// m.hold if the story queue and notices must wait under it, like a duel started from an event option)
const DRAWM = { event: drawEvent, sheet: drawSheet, family: drawFamily, pick: drawPick, opts: drawOpts, why: drawWhy, talk: drawTalk, tour: drawTour, list: drawList, acts: drawActs };
const SCROLLM = new Set(['family', 'pick', 'list', 'acts']);
function render() {
  TQ.length = 0; HITS = []; TCLIP = HCLIP = null; DRY = false;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#0b1020'; ctx.fillRect(0, 0, cv.width, cv.height);
  g.imageSmoothingEnabled = false; g.globalAlpha = 1;
  if (state === 'title') drawTitleArt(); else rect(0, 0, W_, H, '#2a2030');
  if (state === 'title') { SCR = NOSCR; drawTitle(); }
  else {
    SCR = PEOPLE_SCR;
    drawCity();
    for (const m of MODAL.slice()) {
      layerBreak();
      SCR = m.scr || (m.scr = newScr());
      const f = DRAWM[m.type];
      if (f) f(m);
      else if (SYS.modal[m.type]) { if (!m.pass) HITS = []; TANCH = [20, 1]; SYS.modal[m.type](m); }
      else drop(m);   // a window nobody can draw must not block the game
    }
    // only the top layer scrolls
    const t = top();
    SCR = t ? (SCROLLM.has(t.type) || t.scroll ? t.scr : NOSCR) : (W.loc === 'people' ? PEOPLE_SCR : NOSCR);
    NOSCR.max = NOSCR.maxX = 0;
  }
  layerBreak();
  const keepHits = HITS; drawTopBar(); HITS = keepHits;
  if (!holding()) drawToasts();
  present();
}
// Text is drawn crisp on top of the pixel layer, so every modal starts a new layer: flush what's below first.
function layerBreak() { present(); g.clearRect(0, 0, W_, H); TQ.length = 0; }

// ============================================================ cover (open index.html#cover, then tools/shot.py -> cover.png)
let shareEl = null;
// cover: the painted key art (art/cover.jpg) with the title over the open sky on the right
function renderCover() {
  const img = new Image();
  img.onload = () => {
    const big = mk(1920, 1080), bx = big.getContext('2d');
    bx.drawImage(img, 0, 0, 1920, 1080);
    const gr = bx.createRadialGradient(1590, 300, 60, 1590, 300, 520); gr.addColorStop(0, 'rgba(10,20,28,.45)'); gr.addColorStop(1, 'rgba(10,20,28,0)');
    bx.fillStyle = gr; bx.fillRect(1000, 0, 920, 900);
    bx.textAlign = 'center'; bx.lineJoin = 'round'; bx.strokeStyle = '#1b1622';
    bx.font = '150px ' + FONT; bx.lineWidth = 24; bx.strokeText('一喵天下', 1590, 250); bx.fillStyle = '#ffe08a'; bx.fillText('一喵天下', 1590, 250);
    bx.font = '52px ' + FONT; bx.lineWidth = 11; bx.strokeText('All Under Paw', 1590, 340); bx.fillStyle = '#f2ead4'; bx.fillText('All Under Paw', 1590, 340);
    bx.font = '40px ' + FONT; bx.lineWidth = 9; bx.strokeText('押宝秦国质子 · 猫猫王朝模拟', 1590, 420); bx.fillText('押宝秦国质子 · 猫猫王朝模拟', 1590, 420);
    document.body.innerHTML = ''; big.style.cssText = 'position:fixed;left:0;top:0;width:1920px;height:1080px'; document.body.appendChild(big);
    document.title = 'COVER READY';
  };
  img.src = 'art/cover.jpg';
}
// ============================================================ present: pixel layer + crisp text
function present() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = false; ctx.globalAlpha = 1;
  ctx.drawImage(low, 0, 0, W_, H, 0, 0, W_ * K, H * K);
  for (const t of TQ) {
    const c = textSprite(t), tw_ = c.w - 2 * c.pad;
    if (t.clip) { ctx.save(); ctx.beginPath(); ctx.rect(t.clip[0] * K, t.clip[1] * K, t.clip[2] * K, t.clip[3] * K); ctx.clip(); }
    ctx.globalAlpha = t.alpha; ctx.drawImage(c.cv, R(t.x * K - c.pad - (t.align === 'center' ? tw_ / 2 : t.align === 'right' ? tw_ : 0)), R(t.y * K - c.h / 2));
    if (t.clip) ctx.restore();
  }
  ctx.globalAlpha = 1;
}
const TXC = new Map();
function textSprite(t) {
  const key = t.s + '|' + t.size + '|' + t.col + '|' + t.stroke + '|' + K + '|' + t.f;
  let c = TXC.get(key); if (c) return c;
  if (TXC.size > 600) TXC.clear();
  const m = document.createElement('canvas'), x = m.getContext('2d'), font = t.size * K + 'px ' + (t.f ? BODY : FONT);
  const r = t.stroke ? Math.max(.75, t.size * .14) * K : 0, pad = Math.ceil(r) + 2;
  x.font = font; m.width = Math.ceil(x.measureText(t.s).width) + pad * 2; m.height = Math.ceil(t.size * K * 1.5) + pad * 2;
  x.font = font; x.textBaseline = 'middle'; x.textAlign = 'left';
  const oy = m.height / 2;
  if (t.stroke) { x.fillStyle = t.stroke; for (const f of [1, .55]) for (let k = 0; k < 16; k++) { const a = k / 16 * Math.PI * 2; x.fillText(t.s, pad + Math.cos(a) * r * f, oy + Math.sin(a) * r * f); } }
  x.fillStyle = t.col; x.fillText(t.s, pad, oy);
  c = { cv: m, w: m.width, h: m.height, pad }; TXC.set(key, c); return c;
}
try { if (document.fonts) { document.fonts.addEventListener('loadingdone', () => TXC.clear()); document.fonts.ready.then(() => TXC.clear()); } } catch (e) {}
const ALLTEXT = [...new Set((SCRIPT_TEXT.match(/[^\x00-\x7f]/g) || []))].join('') + '0123456789+-/!?';
try { if (document.fonts && document.fonts.load) document.fonts.load('12px "ZCOOL QingKe HuangYou"', ALLTEXT).catch(() => {}); } catch (e) {}

// ============================================================ boot
icons();
/*TEST_HOOK*/
if (location.hash === '#cover') { (document.fonts ? document.fonts.ready : Promise.resolve()).then(renderCover); window.__gameBooted = true; return; }
let last = performance.now(), frameErr = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  try { update(dt); render(); frameErr = 0; }
  catch (e) { if (frameErr++ === 0 && window.__gameErr) window.__gameErr(String(e && e.stack || e).slice(0, 600)); }
  requestAnimationFrame(frame);
}
window.__gameBooted = true;
requestAnimationFrame(frame);
})();

</script>
